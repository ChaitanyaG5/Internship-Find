spring.application.name=internship-tracker
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:h2:file:./data/internship-tracker;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

app.fetch.cron=0 0 */6 * * *
app.expiration.cron=0 0 * * * *
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

app.ai.default-provider=OPENROUTER
app.ai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}

sources.remotive.enabled=${SOURCES_REMOTIVE_ENABLED:true}
sources.adzuna.enabled=${SOURCES_ADZUNA_ENABLED:false}
sources.adzuna.country=${ADZUNA_COUNTRY:in}
sources.greenhouse.enabled=false
sources.greenhouse.companies=razorpay,postman
sources.lever.enabled=false
sources.lever.companies=razorpay,postman
sources.muse.enabled=false
sources.jsearch.enabled=false
